name: Python CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          # Install full dev stack (tests + web + report tools used in the repo).
          python -m pip install -e ".[dev,api,report]"
        env:
          PYTHONUTF8: "1"

      - name: Lint (ruff)
        run: |
          ruff format --check .
          ruff check .

      - name: Tests (pytest)
        run: |
          pytest

      - name: Smoke test (CLI analyze)
        run: |
          mkdir -p ./outputs/charts ./outputs/logs
          python -m srm.cli analyze \
            --data ./examples/procurements.json \
            --rules ./examples/rules_ontology.json \
            --out ./outputs/report.json \
            --charts-dir ./outputs/charts \
            --log-dir ./outputs/logs \
            --no-ascii-charts \
            --no-print-violations

      - name: Smoke test (import web app)
        run: |
          python -c "from srm.api.app import app; print(app.title)"

      - name: Smoke test (web routes)
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from srm.api.app import app
          with TestClient(app) as c:
              r = c.get("/health")
              assert r.status_code == 200
              assert r.json().get("status") == "ok"
          print("OK")
          PY
